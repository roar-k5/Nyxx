app = 'nyx-backend'
primary_region = 'bom'  # Mumbai - closest to you, change if needed

[build]
  dockerfile = 'Dockerfile'

[env]
  ENVIRONMENT = 'production'
  UVICORN_WORKERS = '1'

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 50
    hard_limit = 100

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

[mounts]
  source = 'nyx_data'
  destination = '/data'
